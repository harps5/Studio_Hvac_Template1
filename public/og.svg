<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Cream background -->
  <rect width="1200" height="630" fill="#F5F4F0"/>

  <!-- Eyebrow -->
  <g transform="translate(80, 100)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#0F5938" stroke-width="2.5"/>
    <text x="56" y="14" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#0F5938">LETHBRIDGE &amp; AREA · EST. 2009</text>
  </g>

  <!-- Headline -->
  <text x="80" y="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="700" fill="#141414" letter-spacing="-3">Heating and cooling,</text>
  <text x="80" y="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="700" letter-spacing="-3"><tspan fill="#0F5938">done right.</tspan></text>

  <!-- Subhead -->
  <text x="80" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#2A2A2A">Furnace, AC, heat pump, and hot water for Lethbridge homes.</text>
  <text x="80" y="460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#2A2A2A">Same-day service. Written warranties. 24/7 dispatch.</text>

  <!-- Wordmark bottom-right -->
  <g transform="translate(960, 552)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#141414" letter-spacing="-1">Coulee HVAC</text>
  </g>

  <!-- Hairline above wordmark -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#141414" stroke-opacity="0.12" stroke-width="1"/>
</svg>
